[project]
name = "trimind-backend"
version = "0.1.0"
description = "TriMind AI — entrenador multiagente para deportes de resistencia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langgraph>=1.2.14",
    "litellm>=1.104.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
